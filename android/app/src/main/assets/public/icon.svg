<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0B1A0E" />
      <stop offset="60%" stop-color="#040A05" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- High-Luminance Neon Green Gradient -->
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="50%" stop-color="#39FF14" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- White/Lime Core Glow Gradient -->
    <linearGradient id="neonCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#80FFB3" />
      <stop offset="100%" stop-color="#00FF66" />
    </linearGradient>

    <!-- Intense Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Outer Ring Glow Filter -->
    <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Void Black Canvas with Sub-Surface Neon Radial Ambient -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- Outer Tech Border Ring in Neon Green -->
  <rect x="12" y="12" width="488" height="488" rx="102" fill="none" stroke="#00FF66" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Cybernetic Grid Overlay -->
  <g opacity="0.25">
    <circle cx="256" cy="256" r="190" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle cx="256" cy="256" r="130" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-dasharray="4 6"/>
    <line x1="256" y1="40" x2="256" y2="472" stroke="#00FF66" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="40" y1="256" x2="472" y2="256" stroke="#00FF66" stroke-width="1" stroke-dasharray="4 6"/>

    <!-- Corner Reticle Crosshairs -->
    <path d="M 64 80 L 64 64 L 80 64" fill="none" stroke="#00FF66" stroke-width="2"/>
    <path d="M 448 80 L 448 64 L 432 64" fill="none" stroke="#00FF66" stroke-width="2"/>
    <path d="M 64 432 L 64 448 L 80 448" fill="none" stroke="#00FF66" stroke-width="2"/>
    <path d="M 448 432 L 448 448 L 432 448" fill="none" stroke="#00FF66" stroke-width="2"/>
  </g>

  <!-- Luminous Ambient Halo Circle -->
  <circle cx="256" cy="256" r="110" fill="#00FF66" opacity="0.08" filter="url(#ringGlow)" />

  <!-- Outer Glowing Arc Accent Rings -->
  <g filter="url(#ringGlow)">
    <path d="M 256 126 A 130 130 0 0 1 386 256" fill="none" stroke="url(#neonGreenGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M 256 386 A 130 130 0 0 1 126 256" fill="none" stroke="url(#neonGreenGrad)" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Main Symbol Emblem: Stylized Intertwined "E" and "72" -->
  <g transform="translate(136, 136)" filter="url(#neonGlow)">
    <!-- Stylized Geometric "E" Structure -->
    <path d="M 50 65 L 135 65 M 50 120 L 120 120 M 50 175 L 135 175 M 50 65 L 50 175" 
          stroke="url(#neonCoreGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Stylized "72" Structure Intertwined -->
    <!-- "7" -->
    <path d="M 155 65 L 210 65 L 175 175" 
          stroke="url(#neonGreenGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- "2" -->
    <path d="M 150 130 C 150 110, 195 110, 195 132 C 195 155, 150 155, 150 175 L 205 175" 
          stroke="url(#neonGreenGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Precise Core Highlight Overlay -->
  <g transform="translate(136, 136)">
    <path d="M 50 65 L 135 65 M 50 120 L 120 120 M 50 175 L 135 175 M 50 65 L 50 175" 
          stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
    <path d="M 155 65 L 210 65 L 175 175" 
          stroke="#E6FFFA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
    <path d="M 150 130 C 150 110, 195 110, 195 132 C 195 155, 150 155, 150 175 L 205 175" 
          stroke="#E6FFFA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  </g>
</svg>
